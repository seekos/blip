name: BlipMobile
options:
  bundleIdPrefix: com.amov
  deploymentTarget:
    iOS: "16.0"
  generateEmptyDirectories: true

targets:
  BlipMobile:
    type: application
    platform: iOS
    sources:
      - path: main.m
        type: file
        buildPhase: sources
      - path: gpui_ios.h
        type: file
        buildPhase: headers
      - path: LaunchScreen.storyboard
        type: file
        buildPhase: resources
      - path: Assets.xcassets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amov.Blip.mobile
        PRODUCT_NAME: Blip
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGN_STYLE: Automatic
        CLANG_ENABLE_MODULES: YES
        CLANG_ENABLE_OBJC_ARC: YES
        ENABLE_BITCODE: NO
        ENABLE_DEBUG_DYLIB: NO
        OTHER_LINK_BINARY_WITH_LIBRARIES_SECTION_TYPE: static
        DEAD_CODE_STRIPPING: NO
        VALID_ARCHS: arm64
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        OTHER_LDFLAGS:
          - -force_load
          - $(BLIP_STATIC_LIB)
          - -lc++
          - -framework UIKit
          - -framework Metal
          - -framework MetalKit
          - -framework QuartzCore
          - -framework CoreGraphics
          - -framework CoreText
          - -framework CoreFoundation
          - -framework Foundation
          - -framework Security
          - -framework SystemConfiguration
          - -framework Network
          - -framework UniformTypeIdentifiers
          - -framework AVFoundation
          - -framework CoreMedia
          - -ObjC
        GCC_PREPROCESSOR_DEFINITIONS:
          - USE_GPUI_RUST=1
          - $(inherited)
        HEADER_SEARCH_PATHS:
          - $(PROJECT_DIR)
        "BLIP_STATIC_LIB[sdk=iphonesimulator*]": $(PROJECT_DIR)/../../target/aarch64-apple-ios-sim/debug/libblip_mobile.a
        "BLIP_STATIC_LIB[sdk=iphoneos*]": $(PROJECT_DIR)/../../target/aarch64-apple-ios/debug/libblip_mobile.a
      configs:
        Debug:
          GCC_OPTIMIZATION_LEVEL: "0"
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        Release:
          "BLIP_STATIC_LIB[sdk=iphonesimulator*]": $(PROJECT_DIR)/../../target/aarch64-apple-ios-sim/release/libblip_mobile.a
          "BLIP_STATIC_LIB[sdk=iphoneos*]": $(PROJECT_DIR)/../../target/aarch64-apple-ios/release/libblip_mobile.a
          GCC_OPTIMIZATION_LEVEL: s
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

