[package]
name = "blip"
version = "0.1.0"
edition = "2024"
description = "A native, GPU-accelerated cross-platform SFTP client built with GPUI Kit"

[features]
default = []
# 把一个假的 SFTP 服务器编进二进制（127.0.0.1 随机端口、tester / s3cret）。
# 用来在没有真实主机的情况下手工验证「连接 → 列目录 → 上传/下载 → 取消/续传 →
# 从文件管理器拖文件上传」整条链路：`cargo run --features demo-server`。
demo-server = []

[dependencies]
# UI: GPUI Kit re-exports gpui, base, component library and the icon set.
gpui-kit = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
qrcode = { version = "0.14.1", default-features = false, features = ["image"] }
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

# Networking: a dedicated multi-threaded Tokio runtime lives on its own thread.
axum = "0.8"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "net",
    "time",
    "sync",
] }

# SSH / SFTP core (pure Rust, async).
russh = { version = "0.64", default-features = false, features = [
    "ring",
    "rsa",
    "flate2",
] }
russh-sftp = "3.0"

# Cross-runtime actor channels.
flume = { version = "0.12", features = ["async"] }
futures = "0.3"

# Cross-platform encrypted configuration and recycle bin support.
age = "0.11.1"
base64 = "0.22"
dirs = "6"
trash = "5.2.9"
toml = "0.9"

# Utilities.
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
libc = "0.2"
rand = "0.10"
gethostname = "1"
ignore = "0.4.33"
mdns-sd = "0.21"
netdev = { version = "0.47", default-features = false }
mime_guess = "2"
uuid = { version = "1", features = ["v4", "serde"] }

# macOS-only integration. Dock 图标：裸二进制（`cargo run`）没有 bundle，Dock 里只能靠运行时
# `NSApplication.setApplicationIconImage` 换成自己的图标。
# 版本必须与 gpui 依赖树里的对齐（objc2 0.6 / objc2-app-kit 0.3），
# 否则会同时链进两套 objc2，编译时间和二进制体积都会翻倍。
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSImage",
    "NSOpenPanel",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", features = [
    "NSData",
    "NSURL",
] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }

[build-dependencies]
winresource = "0.1"

[patch.crates-io]
# gpui-kit 0.8 still reaches the unmaintained `block 0.1.6`, whose empty enum is
# rejected by future Rust versions. This source-identical patch only makes its
# Objective-C runtime class an inhabited opaque FFI type.
block = { path = "vendor/block" }
# age 0.11 still uses i18n-embed-fl 0.9.4, whose proc-macro-error2 dependency is
# unmaintained and rejected by future Rust. This local copy uses its maintained fork.
i18n-embed-fl = { path = "vendor/i18n-embed-fl" }
