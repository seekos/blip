<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1024 1024">
  <!--
    Blip 应用图标（1024×1024 矢量源）。

    构图：macOS 圆角方块 + 上下双向箭头 —— 上传/下载是 SFTP 客户端唯一的
    核心动作，两个箭头在 16px 下也能辨认。刻意不用双栏、服务器、文件夹这些
    小尺寸会糊成一团的元素。

    用法：`scripts/make-icon.sh` 用 Chrome 无头渲染成 PNG，再 sips 缩放出
    AppIcon.iconset，最后 iconutil 打包成 AppIcon.icns。
  -->
  <defs>
    <linearGradient id="bg" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#6E9BFF"/>
      <stop offset="0.42" stop-color="#2F5FE6"/>
      <stop offset="1" stop-color="#102C86"/>
    </linearGradient>

    <!-- 顶部高光：从左上角往下衰减，模拟 Apple 图标常见的受光面。 -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="plate-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#06123A" flood-opacity="0.34"/>
    </filter>

    <filter id="arrow-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#08184A" flood-opacity="0.34"/>
    </filter>

    <clipPath id="plate-clip">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <!-- 底板 -->
  <g filter="url(#plate-shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>

  <!-- 高光层（裁在底板内） -->
  <g clip-path="url(#plate-clip)">
    <rect x="100" y="100" width="824" height="470" fill="url(#gloss)"/>
  </g>

  <!-- 双向箭头：左向下（下载）、右向上（上传） -->
  <g
    fill="none"
    stroke="#FFFFFF"
    stroke-width="70"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#arrow-shadow)"
  >
    <!-- 下箭头 -->
    <path d="M400 316 V 648"/>
    <path d="M326 576 L400 668 L474 576"/>
    <!-- 上箭头 -->
    <path d="M624 708 V 376"/>
    <path d="M550 448 L624 356 L698 448"/>
  </g>
</svg>
